# and the machjine
- type: entity
  parent: [BaseStructureDisableScrewing, BaseStructureIndestructible, BaseStructureAccessReaderImmuneToEmag, VendingMachineCart]
  id: VendingMachineCoolMedical
  name: Moxie Medical Import Downlink Station
  description: |
    This is Moxie. Say hi to Moxie! She's here to provide you with unlimited chemicals and medical supplies, 
    sourced straight from the manufacturers! Chemical supplies are expensive, as she has to pay for the shipping, 
    handling, and synthesis from the factory, but she'll make sure you'll never need a restock!
    Requires Director of Care access to use.
  components:
  - type: VendingMachine
    pack: CoolMedicalVendInventory
    taxAccounts: # Frontier
      Medical: 0.1 # Frontier
    offState: off
    brokenState: broken
    normalState: normal
    denyState: deny
    ejectDelay: 2
    soundVend: /Audio/_COYOTE/Moxi.ogg
    soundDeny: /Audio/_COYOTE/MoxiNo.ogg
  - type: AccessReader
    access: [["ChiefMedicalOfficer"]]
  - type: Sprite
    sprite: Structures/Machines/VendingMachines/chemvend.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: GuideHelp
    guides:
    - Chemicals
    - Chemist
  - type: Advertise
    pack: MoxiVendAds

- type: localizedDataset
  id: MoxiVendAds
  values:
    prefix: advertisement-moxi-
    count: 7

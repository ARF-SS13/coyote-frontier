#region base
- type: entity
  id: CSBaseWeaponFrameEnergySubMachineGun
  parent: [ NFBaseWeaponEncumbranceSubMachineGun, BaseWeaponBattery ]
  suffix: Frontier
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -0.6
    maxAngle: -2.2
  - type: Gun
    projectileSpeed: 50
    minAngle: 2.5
    maxAngle: 12.5
    angleIncrease: 0.7
    angleDecay: 3.5
    fireRate: 4.5
    selectedMode: FullAuto
    availableModes:
    - FullAuto
  - type: Battery # Default: 40 shots with 60 fireCost
    maxCharge: 2400
    startingCharge: 2400
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 3 # Default recharge rate: 1 shot per 20 seconds with 60 fireCost
  - type: StaticPrice
    price: 350
  - type: NFWeaponDetails
    class: weapon-details-class-submachine-gun

#Power Cell fed weapons
- type: entity
  id: CSBaseWeaponSMGPowerCell
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
  - type: Item
    size: Huge
  - type: AmmoCounter
  - type: Gun
    minAngle: 1.5
    maxAngle: 18.5
    angleIncrease: 1.0
    angleDecay: 5.0
    fireRate: 3.0
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: HitscanBatteryAmmoProvider
    proto: NFRedLightLaser # Frontier: RedLightLaser<NFRedLightLaser
    fireCost: 60 # Frontier: 50<60
  - type: ItemSlots
    slots:
      cell_slot:
        name: Magazine
        startingItem: PowerCellSmall
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
          - PowerCell
          - PowerCellSmall
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: BatterySelfRecharger
    autoRecharge: false
  - type: Appearance
  - type: StaticPrice
    price: 500
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot

#region manufacturer
- type: entity
  id: CSBaseWeaponFrameEnergySubMachineGunNanotrasen
  parent: CSBaseWeaponFrameEnergySubMachineGun
  abstract: true
  components:
  - type: Gun
    minAngle: 2.9
    maxAngle: 14.5
    angleIncrease: 1
    angleDecay: 3.4
    fireRate: 3.8
  - type: NFWeaponDetails
    manufacturer: weapon-details-manufacturer-nanotrasen-munitions

#region chamber
- type: entity
  id: CSBaseWeaponEnergySubMachineGunFireModes
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mode-lethal
      map: ["Firemode"]
      shader: unshaded
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Gun
    examineCaliber: gun-examine-energybolt-low-disabler-pistol
    soundGunshot:
      path: /Audio/_DV/Weapons/Guns/Gunshots/laser.ogg
  - type: ProjectileBatteryAmmoProvider
    proto: NFBulletLaserLow
    fireCost: 60
  - type: EnergyGun
    fireModes:
    - proto: NFBulletDisabler
      fireCost: 60
      name: disable
      state: disabler
    - proto: NFBulletLaserLow
      fireCost: 60
      name: harm
      state: lethal
  - type: GenericVisualizer
    visuals:
      enum.EnergyGunFireModeVisuals.State:
        Firemode:
          Disabler: { state: mode-disabler }
          Lethal: { state: mode-lethal }

- type: entity
  id: CSBaseWeaponEnergySubMachineGunDisabler
  abstract: true
  components:
  - type: Gun
    examineCaliber: gun-examine-energybolt-disabler-pistol
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser2.ogg
  - type: ProjectileBatteryAmmoProvider
    proto: NFBulletDisabler
    fireCost: 60

- type: entity
  id: CSBaseWeaponEnergySubMachineGunHitScan
  abstract: true
  components:
  - type: Gun
    examineCaliber: gun-examine-hitscan-low
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: HitscanBatteryAmmoProvider
    proto: NFRedLightLaser
    fireCost: 60
